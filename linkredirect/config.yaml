# Settings for the link_redirect Lambda.
# Deploy with the AWS CLI, as described in the README.
# Credentials come from the function's IAM role or the AWS credential chain.
# Do not put access keys in this file.
region: us-west-1
function_name: link_redirect
handler: service.handler
description: Lambda function that redirects links as per database entries
runtime: python3.12
timeout: 15
memory_size: 512
environment:
  DYNAMODB_TABLE: urls
  ELASTICSEARCH_URL: ""
  ELASTICSEARCH_INDEX: urls
