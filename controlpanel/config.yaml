# Settings for the control_panel Lambda.
# Deploy with the AWS CLI, as described in the README.
# Credentials come from the function's IAM role or the AWS credential chain.
# Do not put access keys in this file.
region: us-west-1
function_name: control_panel
handler: service.handler
description: control panel for url shortener
runtime: python3.12
timeout: 15
memory_size: 512
environment:
  DYNAMODB_TABLE: urls
